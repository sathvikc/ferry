<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferry</title>
<style>
/* ---------- theme ---------- */

:root {
  --bg: #f5f6f8;
  --panel: #ffffff;
  --text: #1b1f24;
  --muted: #6b7380;
  --line: #e4e7ec;
  --accent: #4f6bed;
  --accent-soft: #eef1fe;
  --danger: #e5484d;
  --danger-soft: #fdecec;
  --ok: #2f9e6b;
  --folder: #f2b33d;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
  --radius: 14px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --text: #e8eaee;
    --muted: #8b93a1;
    --line: #262b35;
    --accent: #7b91ff;
    --accent-soft: #1d2340;
    --danger: #ff6b6f;
    --danger-soft: #3a1c1e;
    --ok: #4cc38a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  }
}

/* ---------- base ---------- */

* { box-sizing: border-box; }

html, body { margin: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { width: 18px; height: 18px; flex: none; }

.wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 64px; }
.muted { color: var(--muted); }

/* ---------- header ---------- */

header { display: flex; align-items: center; gap: 12px; padding: 18px 0; flex-wrap: wrap; }

.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; margin-right: auto; }
.brand .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; }

.chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow);
  font-size: 14px; white-space: nowrap;
}
button.chip:hover { border-color: var(--accent); }

#me input { border: 0; background: transparent; outline: none; width: 14ch; padding: 0; font-weight: 600; }

.online { display: flex; align-items: center; }
.online .av { margin-left: -6px; border: 2px solid var(--bg); }
.online .av:first-child { margin-left: 0; }

.status { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.status.off { background: var(--danger); }

/* round initials badge; color comes from the name */
.av {
  width: 28px; height: 28px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  color: #fff; font-size: 12px; font-weight: 700; text-transform: uppercase;
}
.av.lg { width: 36px; height: 36px; font-size: 14px; }

/* ---------- drop zone ---------- */

.drop {
  display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; text-align: center;
  padding: 28px 16px; border: 2px dashed var(--line); border-radius: var(--radius); background: var(--panel);
  transition: border-color .15s, background .15s;
}
body.dragging .drop { border-color: var(--accent); background: var(--accent-soft); }

.drop .big { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.drop .big svg { width: 24px; height: 24px; }
.drop strong { display: block; font-size: 16px; }
.drop span { color: var(--muted); font-size: 14px; }
.drop .btns { display: flex; gap: 8px; }

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  border: 0; border-radius: 10px; padding: 9px 16px;
  background: var(--accent); color: #fff; font-weight: 600;
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }

/* ---------- upload progress rows ---------- */

#queue { display: grid; gap: 8px; margin-top: 12px; }
#queue:empty { display: none; }

.up { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: grid; gap: 6px; }
.up .row { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.up .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.up .pct { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.up.err .pct { color: var(--danger); }

.bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
.up.err .bar i { background: var(--danger); }

/* ---------- toolbar ---------- */

.toolbar { display: flex; gap: 10px; align-items: center; margin: 28px 0 14px; flex-wrap: wrap; }
.toolbar h2 { margin: 0 auto 0 0; font-size: 17px; }
.toolbar h2 small { color: var(--muted); font-weight: 500; margin-left: 6px; }

.search { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; color: var(--muted); }
.search input { border: 0; outline: none; background: transparent; width: 180px; color: var(--text); }

.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; color: var(--muted); font-size: 14px; }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* ---------- groups ---------- */

.group { margin-bottom: 26px; }
.ghead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.ghead .who { font-weight: 650; }
.ghead .meta { color: var(--muted); font-size: 13px; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }

/* ---------- cards ---------- */

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }

.card {
  display: flex; flex-direction: column; min-width: 0; overflow: hidden;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
}
.card.new { animation: pop .9s ease; }
@keyframes pop { 0% { transform: scale(.96); box-shadow: 0 0 0 3px var(--accent); } 100% { transform: none; } }

.main { display: flex; flex-direction: column; flex: 1; min-width: 0; }

.thumb {
  height: 120px; display: grid; place-items: center; overflow: hidden;
  background: var(--bg); border: 0; border-bottom: 1px solid var(--line); padding: 0; text-decoration: none;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* file-type badge drawn as a page with a folded corner */
.ext {
  position: relative; width: 54px; height: 64px; border-radius: 8px;
  display: grid; place-items: end center; padding-bottom: 8px;
  color: #fff; font-weight: 800; font-size: 12px; letter-spacing: .5px;
}
.ext::before {
  content: ""; position: absolute; top: 0; right: 0;
  border-width: 0 14px 14px 0; border-style: solid;
  border-color: var(--bg) var(--bg) rgba(0, 0, 0, .18) rgba(0, 0, 0, .18);
}

.fold { display: grid; justify-items: center; gap: 2px; color: var(--folder); }
.fold svg { width: 52px; height: 52px; }
.fold small { color: var(--muted); font-size: 12px; font-weight: 600; }

.body { padding: 10px 12px 12px; display: flex; gap: 8px; align-items: flex-end; }
.info { flex: 1; min-width: 0; }
.fname, .fmeta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fname { font-weight: 600; font-size: 14px; }
.fmeta { color: var(--muted); font-size: 12.5px; }

.acts { display: flex; gap: 4px; }
.ico {
  width: 34px; height: 34px; border-radius: 9px; flex: none;
  display: grid; place-items: center;
  border: 1px solid var(--line); background: var(--panel); color: var(--muted); text-decoration: none;
}
.ico:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.ico.del:hover { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
.ico:disabled { opacity: .4; pointer-events: none; }

/* an opened folder takes a full row and lists its files */
.card.open { grid-column: 1 / -1; }
.card.open .main { flex-direction: row; }
.card.open .thumb { width: 140px; height: auto; min-height: 96px; border-bottom: 0; border-right: 1px solid var(--line); }
.card.open .body { flex: 1; align-items: center; }

.inner { list-style: none; margin: 0; padding: 4px 0; border-top: 1px solid var(--line); max-height: 360px; overflow: auto; }
.inner li { display: flex; align-items: center; gap: 10px; padding: 4px 12px; font-size: 13.5px; }
.inner li:hover { background: var(--bg); }
.inner .p { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inner .ico { width: 30px; height: 30px; }

.empty { text-align: center; padding: 48px 16px; color: var(--muted); border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
.empty svg { width: 36px; height: 36px; margin-bottom: 8px; }

/* ---------- toasts ---------- */

#toasts {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
  display: grid; gap: 8px; width: max-content; max-width: calc(100vw - 32px);
}
.toast {
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .2); animation: rise .2s ease;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

/* ---------- phones: cards become compact rows ---------- */

@media (max-width: 640px) {
  header { gap: 8px; }
  .brand { width: 100%; }
  #share .addr { max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }

  .toolbar h2 { width: 100%; }
  .search { flex: 1; }
  .search input { width: 100%; }

  .drop { padding: 22px 16px; }

  .grid { grid-template-columns: 1fr; }
  .main, .card.open .main { flex-direction: row; }
  .thumb, .card.open .thumb { width: 76px; height: auto; min-height: 76px; border-bottom: 0; border-right: 1px solid var(--line); }
  .ext { width: 38px; height: 46px; font-size: 10px; padding-bottom: 5px; }
  .fold svg { width: 34px; height: 34px; }
  .body { flex: 1; align-items: center; min-width: 0; }
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg></div>
      Ferry
    </div>

    <button class="chip" id="share" title="Copy link for other devices">
      <span class="status" id="dot"></span>
      <span class="addr" id="addr">…</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
    </button>

    <div class="chip">
      <div class="online" id="online"></div>
      <span class="muted" id="onlineCount">Connecting…</span>
    </div>

    <label class="chip" id="me" title="This is your name. Click to change it.">
      <span class="av" id="meAv"></span>
      <input id="meName" maxlength="40" aria-label="Your name">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted);width:15px;height:15px"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </label>
  </header>

  <div class="drop" id="drop">
    <div class="big"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></div>
    <div>
      <strong>Drop files or folders anywhere</strong>
      <span>or paste, or pick from your device</span>
    </div>
    <div class="btns">
      <button class="btn" type="button" id="pickFiles">Files</button>
      <button class="btn ghost" type="button" id="pickFolder">Folder</button>
    </div>
    <input type="file" id="fileInput" multiple hidden>
    <input type="file" id="folderInput" webkitdirectory hidden>
  </div>

  <div id="queue"></div>

  <div class="toolbar">
    <h2>Shared files<small id="total"></small></h2>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Search files or people" type="search">
    </label>
    <div class="seg" id="view">
      <button data-v="people">By person</button>
      <button data-v="recent">Recent</button>
    </div>
  </div>

  <div id="list"></div>

</div>
<div id="toasts"></div>

<script>
// ---------- tiny utilities ----------

const $ = s => document.querySelector(s);

// localStorage can throw (private mode, blocked storage); the app works without it
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const randomId = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

function fmtSize(bytes) {
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;

  while (bytes >= 1024 && i < units.length - 1) {
    bytes /= 1024;
    i++;
  }

  return `${bytes < 10 && i ? bytes.toFixed(1) : Math.round(bytes)} ${units[i]}`;
}

function ago(t) {
  const s = (Date.now() - t) / 1000;

  if (s < 45) return 'just now';
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;

  return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.remove(), 3200);
}

// http://<lan-ip> is not a secure context, so the Clipboard API is missing there
function copy(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);

  const t = document.createElement('textarea');
  t.value = text;
  t.style.position = 'fixed';
  t.style.opacity = '0';
  document.body.append(t);
  t.select();
  document.execCommand('copy');
  t.remove();

  return Promise.resolve();
}

// ---------- icons ----------

const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;

const ICON = {
  download: svg('<path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/>'),
  trash: svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>'),
  folder: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h4l2 2h7A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5Z"/></svg>',
  empty: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>',
};

const EXT_COLORS = {
  PDF: '#e5484d',
  ZIP: '#d97706', RAR: '#d97706', '7Z': '#d97706',
  DOC: '#2563eb', DOCX: '#2563eb',
  XLS: '#16a34a', XLSX: '#16a34a', CSV: '#16a34a',
  PPT: '#ea580c', PPTX: '#ea580c',
  MP4: '#9333ea', MOV: '#9333ea', MKV: '#9333ea',
  MP3: '#db2777', WAV: '#db2777',
  TXT: '#64748b', MD: '#64748b',
  JSON: '#0d9488', JS: '#ca8a04',
  APK: '#65a30d', DMG: '#475569', EXE: '#475569',
};

const extOf = name => (name.includes('.') ? name.split('.').pop() : 'file').slice(0, 4).toUpperCase();
const isImage = f => /^image\/(png|jpe?g|gif|webp|avif|bmp|svg\+xml)$/.test(f.type);

// ---------- identity: random friendly name, editable, remembered per browser ----------

const ADJECTIVES = ['Swift', 'Calm', 'Brave', 'Sunny', 'Lucky', 'Clever', 'Mellow', 'Witty', 'Bold', 'Cosmic', 'Fuzzy', 'Jolly', 'Quiet', 'Rapid', 'Zesty', 'Breezy', 'Gentle', 'Nimble'];
const ANIMALS = ['Otter', 'Panda', 'Falcon', 'Koala', 'Fox', 'Tiger', 'Penguin', 'Lynx', 'Dolphin', 'Badger', 'Owl', 'Gecko', 'Moose', 'Rabbit', 'Heron', 'Yak', 'Bison', 'Raven'];
const pick = list => list[Math.floor(Math.random() * list.length)];

const cid = store.get('cid') || randomId();
let me = store.get('name') || `${pick(ADJECTIVES)} ${pick(ANIMALS)}`;
store.set('cid', cid);
store.set('name', me);

// same name always gets the same avatar color
const hue = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 0);
const initials = s => s.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('') || '?';
const avatar = (name, cls = '', id = '') =>
  `<span ${id ? `id="${id}"` : ''} class="av ${cls}" style="background:hsl(${hue(name)} 62% 52%)" title="${esc(name)}">${esc(initials(name))}</span>`;

const nameInput = $('#meName');

function paintMe() {
  nameInput.value = me;
  $('#meAv').outerHTML = avatar(me, '', 'meAv');
}

nameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') nameInput.blur();
  if (e.key === 'Escape') { nameInput.value = me; nameInput.blur(); }
});

nameInput.addEventListener('blur', () => {
  const next = nameInput.value.trim().slice(0, 40);
  if (!next || next === me) { nameInput.value = me; return; }

  me = next;
  store.set('name', me);
  paintMe();

  fetch(`/api/rename?${new URLSearchParams({ cid, name: me })}`, { method: 'POST' });
  connect(); // reopen live updates so a later reconnect announces the new name
  toast(`You're now "${me}"`);
});

paintMe();

// ---------- share link ----------

let shareUrl = location.origin;

// opened as localhost: show the LAN address instead, since that is what other devices need
fetch('/api/info').then(r => r.json()).then(({ ips, port }) => {
  if (['localhost', '127.0.0.1'].includes(location.hostname) && ips[0]) shareUrl = `http://${ips[0]}:${port}`;
  $('#addr').textContent = shareUrl.replace(/^https?:\/\//, '');
});

$('#share').onclick = () => copy(shareUrl).then(() => toast('Link copied. Open it on any device on this Wi-Fi.'));

// ---------- state ----------

let files = [];                      // newest first, as the server sends them
let view = store.get('view') || 'people';
const fresh = new Set();             // ids to flash once (files and folders)
const expanded = new Set();          // folder ids whose file list is open
const announced = new Set();         // folder ids already toasted

// many events can land in one frame (a folder upload), so render at most once per frame
let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

function markFresh(id) {
  fresh.add(id);
  setTimeout(() => fresh.delete(id), 1000);
}

// ---------- view controls ----------

const viewButtons = $('#view').querySelectorAll('button');

function setView(v) {
  view = v;
  store.set('view', v);
  viewButtons.forEach(b => b.classList.toggle('on', b.dataset.v === v));
  render();
}

viewButtons.forEach(b => { b.onclick = () => setView(b.dataset.v); });
$('#q').addEventListener('input', render);

// ---------- rendering ----------

// files that belong to one uploaded folder collapse into a single folder item
function toItems(list) {
  const items = [];
  const folders = new Map();

  for (const f of list) {
    if (!f.folder) { items.push(f); continue; }

    let d = folders.get(f.folder);
    if (!d) {
      d = { kind: 'folder', id: f.folder, name: f.path.split('/')[0], by: f.by, cid: f.cid, at: f.at, size: 0, files: [] };
      folders.set(f.folder, d);
      items.push(d);
    }

    d.files.push(f);
    d.size += f.size;
  }

  for (const d of folders.values()) d.files.sort((a, b) => a.path.localeCompare(b.path));
  return items;
}

const countFiles = items => items.reduce((n, it) => n + (it.files ? it.files.length : 1), 0);
const sumSize = items => items.reduce((n, it) => n + it.size, 0);

function fileCard(f) {
  const ext = extOf(f.name);
  const thumb = isImage(f)
    ? `<img src="/f/${f.id}" alt="" loading="lazy">`
    : `<span class="ext" style="background:${EXT_COLORS[ext] || '#6366f1'}">${esc(ext)}</span>`;
  const sub = view === 'recent' ? `${esc(f.by)} · ${fmtSize(f.size)}` : `${fmtSize(f.size)} · ${ago(f.at)}`;

  return `
    <div class="card${fresh.has(f.id) ? ' new' : ''}">
      <div class="main">
        <a class="thumb" href="/f/${f.id}" target="_blank" rel="noopener" title="Open">${thumb}</a>
        <div class="body">
          <div class="info">
            <div class="fname" title="${esc(f.name)}">${esc(f.name)}</div>
            <div class="fmeta">${sub}</div>
          </div>
          <div class="acts">
            <a class="ico" href="/f/${f.id}?dl" download="${esc(f.name)}" title="Download" aria-label="Download ${esc(f.name)}">${ICON.download}</a>
            <button class="ico del" data-del="${f.id}" title="Delete" aria-label="Delete ${esc(f.name)}">${ICON.trash}</button>
          </div>
        </div>
      </div>
    </div>`;
}

function folderCard(d) {
  const open = expanded.has(d.id);
  const count = `${d.files.length} file${d.files.length === 1 ? '' : 's'}`;
  const sub = view === 'recent' ? `${esc(d.by)} · ${count} · ${fmtSize(d.size)}` : `${count} · ${fmtSize(d.size)} · ${ago(d.at)}`;

  // path inside the folder, without the folder's own name
  const rows = open ? d.files.map(f => `
    <li>
      <span class="p" title="${esc(f.path)}">${esc(f.path.split('/').slice(1).join('/'))}</span>
      <span class="muted">${fmtSize(f.size)}</span>
      <a class="ico" href="/f/${f.id}?dl" download="${esc(f.name)}" title="Download this file">${ICON.download}</a>
    </li>`).join('') : '';

  return `
    <div class="card folder${open ? ' open' : ''}${fresh.has(d.id) ? ' new' : ''}">
      <div class="main">
        <button class="thumb" data-toggle="${d.id}" title="${open ? 'Hide' : 'Show'} files" aria-expanded="${open}">
          <span class="fold">${ICON.folder}<small>${d.files.length}</small></span>
        </button>
        <div class="body">
          <div class="info">
            <div class="fname" title="${esc(d.name)}">${esc(d.name)}</div>
            <div class="fmeta">${sub}</div>
          </div>
          <div class="acts">
            <a class="ico" href="/zip/${d.id}" download="${esc(d.name)}.zip" title="Download folder as zip" aria-label="Download ${esc(d.name)} as zip">${ICON.download}</a>
            <button class="ico del" data-del-folder="${d.id}" title="Delete folder" aria-label="Delete folder ${esc(d.name)}">${ICON.trash}</button>
          </div>
        </div>
      </div>
      ${open ? `<ul class="inner">${rows}</ul>` : ''}
    </div>`;
}

const itemCard = it => (it.kind === 'folder' ? folderCard(it) : fileCard(it));
const gridOf = items => `<div class="grid">${items.map(itemCard).join('')}</div>`;

function render() {
  const q = $('#q').value.trim().toLowerCase();
  const matches = f => !q || f.name.toLowerCase().includes(q) || (f.path || '').toLowerCase().includes(q) || f.by.toLowerCase().includes(q);
  const items = toItems(files.filter(matches));
  const list = $('#list');

  $('#total').textContent = files.length ? `${files.length} · ${fmtSize(sumSize(files))}` : '';

  if (!items.length) {
    const msg = files.length ? 'Nothing matches your search.' : 'No files yet. Drop something to share it with everyone here.';
    list.innerHTML = `<div class="empty">${ICON.empty}<div>${msg}</div></div>`;
    return;
  }

  if (view === 'recent') {
    list.innerHTML = gridOf(items);
    return;
  }

  // group by uploader: your own group first, then whoever shared most recently
  const groups = new Map();
  for (const it of items) {
    const key = it.cid || it.by;
    if (!groups.has(key)) groups.set(key, { by: it.by, mine: it.cid === cid, items: [] });
    groups.get(key).items.push(it);
  }

  const ordered = [...groups.values()].sort((a, b) => (b.mine - a.mine) || (b.items[0].at - a.items[0].at));

  list.innerHTML = ordered.map(g => {
    const n = countFiles(g.items);
    return `
      <section class="group">
        <div class="ghead">
          ${avatar(g.by, 'lg')}
          <div>
            <div class="who">${esc(g.by)} ${g.mine ? '<span class="tag">YOU</span>' : ''}</div>
            <div class="meta">${n} file${n === 1 ? '' : 's'} · ${fmtSize(sumSize(g.items))}</div>
          </div>
        </div>
        ${gridOf(g.items)}
      </section>`;
  }).join('');
}

setInterval(render, 30000); // keeps "x min ago" current

// ---------- card actions (one listener for the whole list) ----------

$('#list').addEventListener('click', e => {
  const toggle = e.target.closest('[data-toggle]');
  if (toggle) {
    const id = toggle.dataset.toggle;
    expanded.has(id) ? expanded.delete(id) : expanded.add(id);
    render();
    return;
  }

  // one click deletes; the card disappears for everyone when the server broadcasts 'removed'
  const del = e.target.closest('[data-del], [data-del-folder]');
  if (!del) return;

  del.disabled = true;
  const url = del.dataset.del ? `/api/files/${del.dataset.del}` : `/api/folders/${del.dataset.delFolder}`;
  fetch(url, { method: 'DELETE' }).then(r => { if (!r.ok) toast('Could not delete (already gone?)'); });
});

// ---------- live updates (Server-Sent Events) ----------

let events = null;

function connect() {
  if (events) events.close();
  events = new EventSource(`/api/events?${new URLSearchParams({ cid, name: me })}`);

  events.onopen = () => $('#dot').classList.remove('off');

  // server unreachable: say so instead of leaving an empty online chip; EventSource retries by itself
  events.onerror = () => {
    $('#dot').classList.add('off');
    $('#online').innerHTML = '';
    $('#onlineCount').textContent = 'Offline, retrying…';
  };

  // full list: sent on connect and after renames
  events.addEventListener('files', e => {
    files = JSON.parse(e.data);
    scheduleRender();
  });

  events.addEventListener('added', e => {
    const f = JSON.parse(e.data);
    if (files.some(x => x.id === f.id)) return;

    files.unshift(f);
    markFresh(f.folder || f.id);
    scheduleRender();

    // one toast per folder, not one per file inside it
    if (f.cid === cid) return;
    if (!f.folder) toast(`${f.by} shared ${f.name}`);
    else if (!announced.has(f.folder)) {
      announced.add(f.folder);
      toast(`${f.by} is sharing the folder ${f.path.split('/')[0]}`);
    }
  });

  events.addEventListener('removed', e => {
    const gone = new Set(JSON.parse(e.data));
    files = files.filter(f => !gone.has(f.id));
    scheduleRender();
  });

  events.addEventListener('presence', e => {
    const people = JSON.parse(e.data);
    $('#online').innerHTML = people.slice(0, 5).map(p => avatar(p.name)).join('');
    $('#onlineCount').textContent = `${people.length} online`;
  });
}

connect();

// ---------- upload transport ----------

// at most 3 uploads in flight, so a 2,000-file folder does not open 2,000 requests at once
const MAX_PARALLEL = 3;
const waiting = [];
let running = 0;

function enqueue(task) {
  return new Promise(resolve => {
    waiting.push({ task, resolve });
    pump();
  });
}

function pump() {
  while (running < MAX_PARALLEL && waiting.length) {
    const { task, resolve } = waiting.shift();
    running++;
    task().then(resolve).finally(() => { running--; pump(); });
  }
}

// streams one file as the raw request body; XHR because fetch has no upload progress events
function sendFile(file, extra, onProgress) {
  return new Promise(resolve => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `/api/upload?${new URLSearchParams({ name: file.name, by: me, cid, ...extra })}`);
    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    xhr.upload.onprogress = e => onProgress(e.loaded);
    xhr.onload = () => resolve(xhr.status === 200);
    xhr.onerror = () => resolve(false);
    xhr.send(file);
  });
}

// ---------- upload progress rows ----------

function progressRow(label) {
  const row = document.createElement('div');
  row.className = 'up';
  row.innerHTML = `<div class="row"><span class="n"></span><span class="pct">Waiting…</span></div><div class="bar"><i></i></div>`;
  row.querySelector('.n').textContent = label;
  $('#queue').append(row);

  const pct = row.querySelector('.pct');
  const bar = row.querySelector('.bar i');

  return {
    update(sent, total, suffix = '') {
      const p = total ? Math.round(sent / total * 100) : 100;
      bar.style.width = `${p}%`;
      pct.textContent = `${p}% · ${fmtSize(sent)} / ${fmtSize(total)}${suffix}`;
    },
    finish(ok, text) {
      bar.style.width = '100%';
      pct.textContent = text;
      row.classList.toggle('err', !ok);
      setTimeout(() => row.remove(), ok ? 800 : 6000);
    },
  };
}

// ---------- upload entry points ----------

function uploadFile(file) {
  const row = progressRow(file.name);

  enqueue(() => sendFile(file, {}, sent => row.update(sent, file.size)))
    .then(ok => row.finish(ok, ok ? 'Done' : 'Failed'));
}

// entries: [{ file, path }] where path starts with the folder name, e.g. "Trip/day 1/a.jpg"
function uploadFolder(name, entries) {
  if (!entries.length) { toast(`"${name}" is empty`); return; }

  const folder = randomId();
  const total = entries.reduce((n, e) => n + e.file.size, 0);
  const sent = new Array(entries.length).fill(0);
  let done = 0;
  let failed = 0;

  const row = progressRow(`${name}/`);
  const refresh = () => row.update(sent.reduce((a, b) => a + b, 0), total, ` · ${done + failed}/${entries.length} files`);

  const jobs = entries.map((e, i) =>
    enqueue(() => sendFile(e.file, { folder, path: e.path }, n => { sent[i] = n; refresh(); }))
      .then(ok => {
        if (ok) done++; else failed++;
        sent[i] = e.file.size;
        refresh();
      }));

  Promise.all(jobs).then(() => {
    row.finish(!failed, failed ? `${failed} of ${entries.length} files failed` : `Done · ${entries.length} files`);
  });
}

// a picked folder arrives as a flat list carrying webkitRelativePath ("Trip/day 1/a.jpg")
function uploadPicked(list) {
  const byTop = new Map();

  for (const file of list) {
    const path = file.webkitRelativePath;
    if (!path) { uploadFile(file); continue; }

    const top = path.split('/')[0];
    if (!byTop.has(top)) byTop.set(top, []);
    byTop.get(top).push({ file, path });
  }

  for (const [top, entries] of byTop) uploadFolder(top, entries);
}

// walks a dropped folder; readEntries returns at most ~100 entries per call, so loop until empty
async function walk(entry, prefix = '') {
  const path = prefix + entry.name;

  if (entry.isFile) {
    const file = await new Promise((ok, fail) => entry.file(ok, fail));
    return [{ file, path }];
  }

  const reader = entry.createReader();
  const out = [];

  for (;;) {
    const batch = await new Promise((ok, fail) => reader.readEntries(ok, fail));
    if (!batch.length) break;
    for (const child of batch) out.push(...await walk(child, `${path}/`));
  }

  return out;
}

// ---------- pickers, drag and drop, paste ----------

const fileInput = $('#fileInput');
const folderInput = $('#folderInput');

$('#pickFiles').onclick = () => fileInput.click();
$('#pickFolder').onclick = () => folderInput.click();

fileInput.onchange = () => { [...fileInput.files].forEach(uploadFile); fileInput.value = ''; };
folderInput.onchange = () => { uploadPicked(folderInput.files); folderInput.value = ''; };

// dragenter/dragleave fire for every child element, so count depth to know when the drag really left
let dragDepth = 0;

addEventListener('dragenter', e => {
  if (!e.dataTransfer.types.includes('Files')) return;
  dragDepth++;
  document.body.classList.add('dragging');
});

addEventListener('dragleave', () => {
  if (--dragDepth > 0) return;
  dragDepth = 0;
  document.body.classList.remove('dragging');
});

addEventListener('dragover', e => e.preventDefault());

addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dragging');

  // entries must be read now; the browser empties dataTransfer once this handler returns
  const entries = [...e.dataTransfer.items].map(item => item.webkitGetAsEntry?.()).filter(Boolean);
  if (!entries.length) { [...e.dataTransfer.files].forEach(uploadFile); return; }

  for (const entry of entries) {
    if (entry.isFile) entry.file(uploadFile);
    else walk(entry).then(list => uploadFolder(entry.name, list), () => toast(`Could not read "${entry.name}"`));
  }
});

addEventListener('paste', e => {
  if (e.target === nameInput || e.target.id === 'q') return;
  [...(e.clipboardData?.files || [])].forEach(uploadFile);
});

setView(view);
</script>
